<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Copy & Paste</title>
  <link rel="icon" href="favicon.ico">
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background: #121212;
      color: #e0e0e0;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
      padding: 10px;
      resize: vertical;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
    }

    button:hover {
      background: #3a3a3a;
    }

    #list {
      width: 100%;
      box-sizing: border-box;
    }

    .snippet {
      border: 1px solid #333;
      background: #1a1a1a;
      padding: 10px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    .snippet span {
      flex: 1 1 auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .icon-btn {
      padding: 6px 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2>Copy & Paste</h2>
  <textarea id="input" placeholder="Input text here..."></textarea>
  <br><br>
  <button onclick="addSnippet()">Add</button>

  <div id="list"></div>

<script>
  function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days * 864e5).toUTCString();
    document.cookie = name + "=" + encodeURIComponent(value) + "; expires=" + expires + "; path=/";
  }

  function getCookie(name) {
    return document.cookie.split("; ").reduce((r, v) => {
      const parts = v.split("=");
      return parts[0] === name ? decodeURIComponent(parts[1]) : r
    }, "");
  }

  function saveSnippets() {
    const snippets = [];
    document.querySelectorAll(".snippet span").forEach(span => {
      snippets.push(span.textContent);
    });
    setCookie("snippets", JSON.stringify(snippets), 365);
  }

  function loadSnippets() {
    const data = getCookie("snippets");
    if (!data) return;

    const snippets = JSON.parse(data);
    snippets.forEach(text => createSnippet(text));
  }

  function createSnippet(text) {
    const div = document.createElement("div");
    div.className = "snippet";

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "🗑️";
    deleteBtn.className = "icon-btn";
    deleteBtn.title = "Delete";
    deleteBtn.onclick = () => {
      div.remove();
      saveSnippets();
    };

    const span = document.createElement("span");
    span.textContent = text;

    const copyBtn = document.createElement("button");
    copyBtn.textContent = "Copy";
    copyBtn.onclick = () => navigator.clipboard.writeText(text);

    div.appendChild(deleteBtn);
    div.appendChild(span);
    div.appendChild(copyBtn);

    document.getElementById("list").appendChild(div);
  }

  function addSnippet() {
    const text = document.getElementById("input").value.trim();
    if (!text) return;

    createSnippet(text);
    document.getElementById("input").value = "";
    saveSnippets();
  }

  // Load saved snippets on page load
  window.onload = loadSnippets;
</script>

</body>
</html>
